# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: ns.flgmat
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: https://my305676-api.s4hana.ondemand.com
          - url: https://my305676-api.s4hana.ondemand.com/
            authenticationType: BasicAuthentication
            destination: S4HC_FLOG_MaTTrack
            path: /sap/opu/odata4/sap/api_shipmentcontainerpackg/srvd_a2x/sap/shipmentcontainerunit/0001/
          - url: https://my305676-api.s4hana.ondemand.com/
            authenticationType: BasicAuthentication
            destination: S4HC_FLOG_MaTTrack
            path: /sap/opu/odata4/sap/api_fldlogsshipmentcontainer/srvd_a2x/sap/fldlogsshipmentcontainer/0001/
          - url: https://my305676-api.s4hana.ondemand.com/
            authenticationType: BasicAuthentication
            destination: S4HC_FLOG_MaTTrack
            path: /sap/opu/odata4/sap/api_fldlogsshipmentvoyage/srvd_a2x/sap/fldlogsshipmentvoyage/0001/
          - url: https://my305676-api.s4hana.ondemand.com
            path: /sap/opu/odata/sap/YY1_FLGTRK_TRACKPR_API_CDS/
          - path: /sap/opu/odata/sap/YY1_FLG_WOREF_DELTYPE_API_CDS/
            url: https://my305676-api.s4hana.ondemand.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
